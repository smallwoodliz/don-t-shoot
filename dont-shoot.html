<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Don't Shoot! - Enhanced Clone</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-tap-highlight-color: transparent; }
body, html { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
#app { width: 100%; height: 100%; display: flex; justify-content: center; align-items: center; }
canvas { display: block; touch-action: none; }
#ui {
  position: absolute; top: 0; left: 50%; transform: translateX(-50%);
  width: 420px; max-width: 100%;
  pointer-events: none;
  display: flex; flex-direction: column; align-items: center;
  padding-top: 24px;
}
#score-display {
  font-family: 'Fredoka One', 'Arial Rounded MT Bold', sans-serif;
  font-size: 64px;
  color: #fff;
  -webkit-text-stroke: 4px #0a3a7a;
  text-stroke: 4px #0a3a7a;
  text-shadow: 0 5px 0 #001d4a;
  letter-spacing: -2px;
  line-height: 1;
}
#combo-display {
  font-family: 'Fredoka One', 'Arial Rounded MT Bold', sans-serif;
  font-size: 22px;
  color: #ffe066;
  text-shadow: 0 2px 0 #a0600080;
  opacity: 0;
  transition: opacity 0.3s;
  margin-top: 4px;
}

/* Overlay screens */
#overlay {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: rgba(10,20,60,0.88);
  backdrop-filter: blur(6px);
}
#overlay.hidden { display: none; }
.overlay-title {
  font-family: 'Fredoka One', 'Arial Rounded MT Bold', sans-serif;
  font-size: 42px; color: #fff;
  text-shadow: 0 4px 0 #0006;
  text-align: center; line-height: 1.1;
  margin-bottom: 8px;
}
.overlay-sub {
  font-family: 'Fredoka One', 'Arial Rounded MT Bold', sans-serif;
  font-size: 22px; color: #7ecfff;
  margin-bottom: 36px;
}
.tap-btn {
  font-family: 'Fredoka One', 'Arial Rounded MT Bold', sans-serif;
  font-size: 24px; color: #fff;
  background: linear-gradient(180deg, #ff6b6b, #ee2244);
  border: none; border-radius: 50px;
  padding: 16px 56px;
  box-shadow: 0 6px 0 #99001a, 0 10px 30px #ff224466;
  cursor: pointer; pointer-events: auto;
  transition: transform 0.1s, box-shadow 0.1s;
}
.tap-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #99001a, 0 4px 10px #ff224466; }
#joy-wrap {
  position: absolute; bottom: 48px; left: 50%;
  transform: translateX(-50%);
  width: 420px; max-width: 100%;
  pointer-events: none;
  display: flex; padding: 0 28px;
}
#joy-zone {
  width: 118px; height: 118px;
  background: rgba(255,255,255,0.22);
  border: 3.5px solid rgba(255,255,255,0.55);
  border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  pointer-events: auto;
  box-shadow: 0 4px 20px #0003;
}
#joy-handle {
  width: 50px; height: 50px;
  background: #0288d1;
  border: 3px solid #fff;
  border-radius: 50%;
  box-shadow: 0 3px 10px #0005;
  pointer-events: none;
}
</style>
<link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
</head>
<body>
<div id="app">
  <canvas id="gc"></canvas>
  <div id="ui">
    <div id="score-display">0</div>
    <div id="combo-display">🔥 x3 COMBO!</div>
  </div>
  <div id="joy-wrap">
    <div id="joy-zone"><div id="joy-handle"></div></div>
  </div>
  <div id="overlay">
    <div class="overlay-title" id="ov-title">Don't Shoot<br>Anyone!</div>
    <div class="overlay-sub" id="ov-sub">shoot blocks · dodge people</div>
    <button class="tap-btn" id="ov-btn">tap to play</button>
  </div>
</div>

<script>
// ─── Setup ───────────────────────────────────────────────────────────────────
const canvas = document.getElementById('gc');
const ctx = canvas.getContext('2d');

function resize() {
  const maxW = 420, maxH = window.innerHeight;
  const scale = Math.min(window.innerWidth / maxW, 1);
  canvas.width = maxW;
  canvas.height = Math.round(maxH / scale);
  canvas.style.width = maxW * scale + 'px';
  canvas.style.height = maxH + 'px';
  document.getElementById('ui').style.width = maxW * scale + 'px';
}
resize();
window.addEventListener('resize', resize);

// ─── State ────────────────────────────────────────────────────────────────────
let state = 'menu'; // menu | play | dead
let score = 0, combo = 0, comboTimer = 0;
let raf;

// ─── Player ───────────────────────────────────────────────────────────────────
const P = {
  x: 210, y: 0,
  vx: 0, vy: 0,
  r: 20,         // collision radius
  angle: -Math.PI/2,
  shootTimer: 0,
  walkPhase: 0,
  init() { this.x = 210; this.y = canvas.height * 0.7; this.vx = 0; this.vy = 0; this.angle = -Math.PI/2; this.shootTimer = 0; }
};

// ─── Input ────────────────────────────────────────────────────────────────────
const mouse = { x: 210, y: 300, down: false };
const joy = { active: false, vx: 0, vy: 0 }; // joystick movement vector
const keys = {};

// Joystick setup
const joyZone = document.getElementById('joy-zone');
const joyHandle = document.getElementById('joy-handle');
const JOY_MAX = 34;

function joyStart(cx, cy) {
  joy.active = true;
  joyMove(cx, cy);
}
function joyMove(cx, cy) {
  const r = joyZone.getBoundingClientRect();
  let dx = cx - (r.left + r.width/2);
  let dy = cy - (r.top + r.height/2);
  const dist = Math.hypot(dx, dy);
  if (dist > JOY_MAX) { dx = dx/dist*JOY_MAX; dy = dy/dist*JOY_MAX; }
  joyHandle.style.transform = `translate(${dx}px,${dy}px)`;
  joy.vx = dx / JOY_MAX;
  joy.vy = dy / JOY_MAX;
}
function joyEnd() {
  joy.active = false; joy.vx = 0; joy.vy = 0;
  joyHandle.style.transform = 'translate(0,0)';
}

joyZone.addEventListener('touchstart', e => { joyStart(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault(); e.stopPropagation(); }, { passive: false });
window.addEventListener('touchmove', e => {
  // Route touches: if joystick active, update joy; otherwise update aim
  if (joy.active) { joyMove(e.touches[0].clientX, e.touches[0].clientY); }
  else {
    const r = canvas.getBoundingClientRect();
    mouse.x = (e.touches[0].clientX - r.left) * (canvas.width / r.width);
    mouse.y = (e.touches[0].clientY - r.top) * (canvas.height / r.height);
  }
  e.preventDefault();
}, { passive: false });
window.addEventListener('touchend', e => {
  if (joy.active && e.touches.length === 0) joyEnd();
  if (!joy.active) mouse.down = false;
});

// Aim / shoot via canvas touch (non-joystick area)
canvas.addEventListener('touchstart', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.touches[0].clientX - r.left) * (canvas.width / r.width);
  mouse.y = (e.touches[0].clientY - r.top) * (canvas.height / r.height);
  mouse.down = true;
  e.preventDefault();
}, { passive: false });

// PC mouse
canvas.addEventListener('mousemove', e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (canvas.width / r.width);
  mouse.y = (e.clientY - r.top) * (canvas.height / r.height);
});
canvas.addEventListener('mousedown', e => { mouse.down = true; e.preventDefault(); });
window.addEventListener('mouseup', () => { mouse.down = false; });

// WASD keyboard
window.addEventListener('keydown', e => { keys[e.key] = true; });
window.addEventListener('keyup', e => { keys[e.key] = false; });

// ─── Entities ─────────────────────────────────────────────────────────────────
let bullets = [];
let blocks = [];    // 3D ice blocks
let npcs = [];
let particles = [];
let floatTexts = [];

// ─── Block (3D cube) ──────────────────────────────────────────────────────────
function makeBlock(x, y, size) {
  return { x, y, size, hp: 3, maxHp: 3, crackPhase: 0, bobPhase: Math.random()*Math.PI*2, alive: true, shakeTimer: 0 };
}

function spawnBlocks() {
  blocks = [];
  const W = canvas.width, H = canvas.height;
  // Scattered arrangement like the video
  const positions = [
    [W*0.2, H*0.15], [W*0.6, H*0.12], [W*0.85, H*0.22],
    [W*0.1, H*0.32], [W*0.45, H*0.28], [W*0.78, H*0.38],
    [W*0.25, H*0.44], [W*0.65, H*0.42],
    [W*0.5, H*0.18],
  ];
  positions.forEach(([x,y]) => blocks.push(makeBlock(x, y, 28 + Math.random()*14)));
}

// NPC colors/types
const NPC_TYPES = [
  { body: '#e53935', hat: '#b71c1c', pants: '#1565c0', skin: '#ffe0b2' }, // red
  { body: '#43a047', hat: '#1b5e20', pants: '#4a148c', skin: '#ffccbc' }, // green
  { body: '#fb8c00', hat: '#e65100', pants: '#1a237e', skin: '#ffe0b2' }, // orange
  { body: '#8e24aa', hat: '#4a148c', pants: '#33691e', skin: '#ffccbc' }, // purple
];

function spawnNPC() {
  const type = NPC_TYPES[Math.floor(Math.random() * NPC_TYPES.length)];
  const x = 30 + Math.random() * (canvas.width - 60);
  return {
    x, y: -30,
    speed: 1.0 + Math.random() * 0.8, // base speed, scaled by difficulty in update
    r: 16,
    type,
    walkPhase: Math.random() * Math.PI * 2,
    alive: true,
    scared: false,
  };
}

// ─── Drawing helpers ──────────────────────────────────────────────────────────

function drawBlock3D(b) {
  const bob = Math.sin(b.bobPhase) * 2;
  // Shake offset when hit
  const shakeX = b.shakeTimer > 0 ? (Math.random()-0.5) * 4 * b.shakeTimer : 0;
  const shakeY = b.shakeTimer > 0 ? (Math.random()-0.5) * 4 * b.shakeTimer : 0;
  const x = b.x + shakeX, y = b.y + bob + shakeY;
  const s = b.size;
  const d = s * 0.35;

  // Color based on damage stage (3=full, 2=cracked, 1=broken)
  const dmg = b.hp; // 3,2,1
  const frontTop = dmg === 3 ? '#4fc3f7' : dmg === 2 ? '#29b6f6' : '#0288d1';
  const frontBot = dmg === 3 ? '#29b6f6' : dmg === 2 ? '#0288d1' : '#01579b';
  const sideCol  = dmg === 3 ? '#0288d1' : dmg === 2 ? '#01579b' : '#003a6e';
  const topCol   = dmg === 3 ? '#b3e5fc' : dmg === 2 ? '#81d4fa' : '#4fc3f7';

  // Shadow
  ctx.save();
  ctx.globalAlpha = 0.18;
  ctx.fillStyle = '#000';
  ctx.beginPath();
  ctx.ellipse(x, y + s * 0.6 + d * 0.5, s * 0.8, s * 0.22, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();

  // Right face
  ctx.beginPath();
  ctx.moveTo(x + s*0.5, y - s*0.3);
  ctx.lineTo(x + s*0.5 + d, y - s*0.3 - d*0.5);
  ctx.lineTo(x + s*0.5 + d, y + s*0.3 - d*0.5);
  ctx.lineTo(x + s*0.5, y + s*0.3);
  ctx.closePath();
  ctx.fillStyle = sideCol; ctx.fill();
  ctx.strokeStyle = '#01579b'; ctx.lineWidth = 2; ctx.stroke();

  // Top face
  ctx.beginPath();
  ctx.moveTo(x - s*0.5, y - s*0.3);
  ctx.lineTo(x - s*0.5 + d, y - s*0.3 - d*0.5);
  ctx.lineTo(x + s*0.5 + d, y - s*0.3 - d*0.5);
  ctx.lineTo(x + s*0.5, y - s*0.3);
  ctx.closePath();
  ctx.fillStyle = topCol; ctx.fill();
  ctx.strokeStyle = '#4fc3f7'; ctx.lineWidth = 1.5; ctx.stroke();

  // Front face
  ctx.beginPath();
  ctx.moveTo(x - s*0.5, y - s*0.3);
  ctx.lineTo(x + s*0.5, y - s*0.3);
  ctx.lineTo(x + s*0.5, y + s*0.3);
  ctx.lineTo(x - s*0.5, y + s*0.3);
  ctx.closePath();
  const grad = ctx.createLinearGradient(x - s*0.5, y - s*0.3, x + s*0.5, y + s*0.3);
  grad.addColorStop(0, frontTop); grad.addColorStop(1, frontBot);
  ctx.fillStyle = grad; ctx.fill();
  ctx.strokeStyle = '#0288d1'; ctx.lineWidth = 2.5; ctx.stroke();

  // Progressive crack lines — stage 2: 2 cracks, stage 1: 4 cracks
  if (b.hp <= 2) {
    ctx.strokeStyle = '#ffffffaa'; ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(x - s*0.2, y - s*0.05); ctx.lineTo(x + s*0.15, y + s*0.25);
    ctx.moveTo(x + s*0.1, y - s*0.28); ctx.lineTo(x - s*0.05, y + s*0.05);
    ctx.stroke();
  }
  if (b.hp <= 1) {
    ctx.strokeStyle = '#ffffff88'; ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x - s*0.35, y + s*0.1); ctx.lineTo(x + s*0.05, y - s*0.15);
    ctx.moveTo(x + s*0.3, y + s*0.1); ctx.lineTo(x + s*0.05, y - s*0.0);
    ctx.stroke();
    // Red tint overlay for nearly-destroyed block
    ctx.save(); ctx.globalAlpha = 0.15; ctx.fillStyle = '#ef5350';
    ctx.beginPath();
    ctx.moveTo(x - s*0.5, y - s*0.3); ctx.lineTo(x + s*0.5, y - s*0.3);
    ctx.lineTo(x + s*0.5, y + s*0.3); ctx.lineTo(x - s*0.5, y + s*0.3);
    ctx.closePath(); ctx.fill(); ctx.restore();
  }

  // Shine
  ctx.save();
  ctx.globalAlpha = dmg === 3 ? 0.35 : dmg === 2 ? 0.2 : 0.08;
  ctx.fillStyle = '#ffffff';
  ctx.beginPath();
  ctx.ellipse(x - s*0.15, y - s*0.12, s*0.18, s*0.09, -0.5, 0, Math.PI*2);
  ctx.fill();
  ctx.restore();
}

function drawPlayer() {
  const p = P;
  p.walkPhase += 0.12;
  const lean = Math.sin(p.walkPhase) * 0.08;
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(lean);

  // Shadow
  ctx.save(); ctx.globalAlpha = 0.2;
  ctx.fillStyle = '#000';
  ctx.beginPath(); ctx.ellipse(0, 22, 18, 6, 0, 0, Math.PI*2); ctx.fill();
  ctx.restore();

  // Body / hoodie (yellow)
  ctx.fillStyle = '#ffd600';
  ctx.beginPath(); ctx.ellipse(0, 6, 16, 18, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#f9a825'; ctx.lineWidth = 2.5; ctx.stroke();

  // Legs
  const legSwing = Math.sin(p.walkPhase) * 5;
  ctx.fillStyle = '#1565c0';
  ctx.beginPath(); ctx.roundRect(-8, 18, 7, 12, 3); ctx.fill(); // left leg
  ctx.beginPath(); ctx.roundRect(1, 18, 7, 12, 3); ctx.fill(); // right leg
  // Shoes
  ctx.fillStyle = '#212121';
  ctx.beginPath(); ctx.ellipse(-5, 31, 6, 3, 0.15, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5, 31, 6, 3, -0.15, 0, Math.PI*2); ctx.fill();

  // Head
  ctx.fillStyle = '#ffe0b2';
  ctx.beginPath(); ctx.arc(0, -8, 13, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ffcc80'; ctx.lineWidth = 1.5; ctx.stroke();

  // Hat (black baseball cap)
  ctx.fillStyle = '#212121';
  ctx.beginPath(); ctx.ellipse(0, -17, 13, 7, 0, Math.PI, 0); ctx.fill();
  ctx.beginPath(); ctx.ellipse(0, -17, 14, 8, 0, Math.PI, 0); // brim
  ctx.fillStyle = '#1a1a1a'; ctx.fill();

  // Eyes
  const eyeDir = { x: Math.cos(p.angle), y: Math.sin(p.angle) };
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-5 + eyeDir.x*2, -8 + eyeDir.y*2, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5 + eyeDir.x*2, -8 + eyeDir.y*2, 2.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-4.5 + eyeDir.x*2, -8.5 + eyeDir.y*2, 0.8, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(5.5 + eyeDir.x*2, -8.5 + eyeDir.y*2, 0.8, 0, Math.PI*2); ctx.fill();

  // Arms with guns
  const armAngle = p.angle;
  const gunLen = 18;

  ctx.save();
  ctx.translate(Math.cos(armAngle - 0.35) * 12, Math.sin(armAngle - 0.35) * 12 + 6);
  ctx.rotate(armAngle - 0.35);
  ctx.fillStyle = '#ffe0b2';
  ctx.beginPath(); ctx.ellipse(4, 0, 8, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.fillRect(8, -3, gunLen, 5);
  ctx.fillStyle = '#555';
  ctx.fillRect(10, -5, gunLen-4, 2); // barrel top
  ctx.restore();

  ctx.save();
  ctx.translate(Math.cos(armAngle + 0.35) * 12, Math.sin(armAngle + 0.35) * 12 + 6);
  ctx.rotate(armAngle + 0.35);
  ctx.fillStyle = '#ffe0b2';
  ctx.beginPath(); ctx.ellipse(4, 0, 8, 5, 0, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#333';
  ctx.fillRect(8, -3, gunLen, 5);
  ctx.fillStyle = '#555';
  ctx.fillRect(10, -5, gunLen-4, 2);
  ctx.restore();

  ctx.restore();
}

function drawNPC(npc) {
  const t = npc.type;
  npc.walkPhase = (npc.walkPhase || 0) + 0.14;
  const bob = Math.sin(npc.walkPhase) * 2.5;

  ctx.save();
  ctx.translate(npc.x, npc.y + bob);

  if (npc.scared) ctx.save();

  // Shadow
  ctx.save(); ctx.globalAlpha = 0.15;
  ctx.fillStyle='#000'; ctx.beginPath(); ctx.ellipse(0,18,12,4,0,0,Math.PI*2); ctx.fill();
  ctx.restore();

  // Legs — alternate stepping
  const legSwing = Math.sin(npc.walkPhase) * 4;
  ctx.fillStyle = t.pants;
  ctx.beginPath(); ctx.roundRect(-8+legSwing*0.3, 10, 6, 11, 2); ctx.fill();
  ctx.beginPath(); ctx.roundRect(2-legSwing*0.3, 10, 6, 11, 2); ctx.fill();
  // Shoes
  ctx.fillStyle = '#111';
  ctx.beginPath(); ctx.ellipse(-5+legSwing*0.3, 22, 5, 2.5, 0, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(5-legSwing*0.3, 22, 5, 2.5, 0, 0, Math.PI*2); ctx.fill();

  // Body
  ctx.fillStyle = t.body;
  ctx.beginPath(); ctx.ellipse(0, 2, 11, 13, 0, 0, Math.PI*2); ctx.fill();
  ctx.strokeStyle = t.hat; ctx.lineWidth = 1.5; ctx.stroke();

  // Head
  ctx.fillStyle = t.skin;
  ctx.beginPath(); ctx.arc(0, -11, 10, 0, Math.PI*2); ctx.fill();

  // Red hat (GDD: all NPCs have the iconic small red hat)
  ctx.fillStyle = '#d32f2f';
  ctx.beginPath(); ctx.ellipse(0, -18, 10, 5.5, 0, Math.PI, 0); ctx.fill();
  ctx.fillRect(-11, -18, 22, 3);
  // Hat brim highlight
  ctx.fillStyle = '#ef5350';
  ctx.fillRect(-11, -18, 22, 2);

  // Eyes
  const eyeSize = npc.scared ? 3.2 : 2;
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(-3.5, -12, eyeSize+0.5, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.5, -12, eyeSize+0.5, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#222';
  ctx.beginPath(); ctx.arc(-3.5, -12, eyeSize, 0, Math.PI*2); ctx.fill();
  ctx.beginPath(); ctx.arc(3.5, -12, eyeSize, 0, Math.PI*2); ctx.fill();

  // Mouth
  ctx.strokeStyle = '#555'; ctx.lineWidth = 1.5;
  ctx.beginPath();
  if (npc.scared) { ctx.arc(0, -7, 3.5, 0, Math.PI); }
  else { ctx.arc(0, -9, 3, 0.2, Math.PI-0.2); }
  ctx.stroke();

  // Sweat if scared
  if (npc.scared) {
    ctx.fillStyle = '#64b5f6';
    ctx.beginPath(); ctx.arc(12, -14, 3, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }

  ctx.restore();
}

// ─── Background ───────────────────────────────────────────────────────────────
function drawBackground() {
  const W = canvas.width, H = canvas.height;

  // Sky gradient
  const skyGrad = ctx.createLinearGradient(0, 0, 0, H * 0.6);
  skyGrad.addColorStop(0, '#1565c0');
  skyGrad.addColorStop(1, '#42a5f5');
  ctx.fillStyle = skyGrad;
  ctx.fillRect(0, 0, W, H * 0.6);

  // Ground gradient
  const groundGrad = ctx.createLinearGradient(0, H*0.55, 0, H);
  groundGrad.addColorStop(0, '#a5d6a7');
  groundGrad.addColorStop(0.3, '#81c784');
  groundGrad.addColorStop(1, '#388e3c');
  ctx.fillStyle = groundGrad;
  ctx.fillRect(0, H*0.55, W, H*0.45);

  // Ground line / path
  ctx.fillStyle = '#c8e6c9';
  ctx.fillRect(0, H*0.56, W, H*0.02);

  // Some clouds
  drawCloud(W*0.15, H*0.08, 50);
  drawCloud(W*0.55, H*0.05, 65);
  drawCloud(W*0.82, H*0.12, 40);

  // Ground grid lines (subtle)
  ctx.strokeStyle = '#66bb6a44'; ctx.lineWidth = 1;
  for (let gx = 0; gx < W; gx += 40) {
    ctx.beginPath(); ctx.moveTo(gx, H*0.57); ctx.lineTo(gx, H); ctx.stroke();
  }
}

function drawCloud(x, y, size) {
  ctx.save();
  ctx.globalAlpha = 0.75;
  ctx.fillStyle = '#e3f2fd';
  [[-size*0.4,0],[0,-size*0.25],[size*0.4,0],[0,size*0.1]].forEach(([dx,dy],i) => {
    ctx.beginPath();
    ctx.arc(x+dx, y+dy, size*(0.3+i*0.03), 0, Math.PI*2);
    ctx.fill();
  });
  ctx.restore();
}

// ─── Particles ────────────────────────────────────────────────────────────────
function addParticles(x, y, color, count = 10, type = 'square') {
  for (let i = 0; i < count; i++) {
    const angle = Math.random() * Math.PI * 2;
    const speed = 2 + Math.random() * 4;
    particles.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed - 2,
      size: type === 'ice' ? (3 + Math.random()*5) : (2 + Math.random()*3),
      color,
      life: 1,
      decay: 0.025 + Math.random()*0.02,
      type
    });
  }
}

function addFloatText(x, y, text, color = '#fff') {
  floatTexts.push({ x, y, text, color, life: 1, vy: -1.5 });
}

// ─── Update ───────────────────────────────────────────────────────────────────
let npcTimer = 0;
let bgBobT = 0;

function getDifficulty() {
  // Scales from 1.0 at score=0 to 3.0 at score=50+
  return 1 + Math.min(score / 25, 2);
}

function update(dt) {
  bgBobT += dt;
  P.walkPhase += dt * 4;
  const diff = getDifficulty();

  // Player aims at mouse/touch (always)
  P.angle = Math.atan2(mouse.y - P.y, mouse.x - P.x);

  // ── Movement: joystick (touch) or WASD (PC) — fully decoupled from aim ──
  let mvx = 0, mvy = 0;
  if (joy.active) {
    mvx = joy.vx; mvy = joy.vy;
  } else {
    if (keys['w'] || keys['ArrowUp'])    mvy -= 1;
    if (keys['s'] || keys['ArrowDown'])  mvy += 1;
    if (keys['a'] || keys['ArrowLeft'])  mvx -= 1;
    if (keys['d'] || keys['ArrowRight']) mvx += 1;
    // Normalize diagonal
    const ml = Math.hypot(mvx, mvy);
    if (ml > 1) { mvx /= ml; mvy /= ml; }
  }
  const SPEED = 5;
  P.vx += mvx * SPEED * 0.4;
  P.vy += mvy * SPEED * 0.4;

  // ── Shoot: press/hold on canvas (right side of screen) ──
  if (mouse.down) {
    P.shootTimer -= dt;
    if (P.shootTimer <= 0) {
      P.shootTimer = 0.09;
      const spread = (Math.random()-0.5) * 0.28;
      const bAngle = P.angle + spread;
      const gunTip = 32;
      bullets.push({
        x: P.x + Math.cos(P.angle) * gunTip,
        y: P.y + Math.sin(P.angle) * gunTip,
        vx: Math.cos(bAngle) * 13,
        vy: Math.sin(bAngle) * 13,
        life: 1
      });
      P.vx -= Math.cos(P.angle) * 0.6;
      P.vy -= Math.sin(P.angle) * 0.6;
      addParticles(P.x + Math.cos(P.angle)*30, P.y + Math.sin(P.angle)*30, '#ffe066', 3, 'square');
    }
  }

  // Player physics
  P.vx *= 0.88; P.vy *= 0.88;
  P.x += P.vx; P.y += P.vy;
  // Bounds
  P.x = Math.max(P.r, Math.min(canvas.width - P.r, P.x));
  P.y = Math.max(P.r, Math.min(canvas.height - P.r, P.y));

  // Blocks bob
  blocks.forEach(b => { if (b.alive) { b.bobPhase += dt * 1.8; if(b.shakeTimer>0) b.shakeTimer = Math.max(0, b.shakeTimer - dt*8); } });

  // Bullets
  for (let i = bullets.length-1; i >= 0; i--) {
    const b = bullets[i];
    b.x += b.vx; b.y += b.vy;
    b.life -= 0.015;
    if (b.life <= 0 || b.x < -20 || b.x > canvas.width+20 || b.y < -20 || b.y > canvas.height+20) {
      bullets.splice(i, 1); continue;
    }

    // Block hit
    let hitBlock = false;
    for (let j = blocks.length-1; j >= 0; j--) {
      const bl = blocks[j];
      if (!bl.alive) continue;
      if (Math.hypot(b.x - bl.x, b.y - bl.y) < bl.size * 0.9) {
        bl.hp--;
        bl.shakeTimer = 1;
        bullets.splice(i, 1); hitBlock = true;

        // Particles scale with damage stage
        if (bl.hp > 0) {
          // Hit but not destroyed — smaller burst
          addParticles(b.x, b.y, '#29b6f6', 6, 'ice');
          addParticles(b.x, b.y, '#b3e5fc', 3, 'ice');
          addFloatText(bl.x, bl.y - bl.size - 8, bl.hp === 2 ? '💥' : '⚠️', '#fff');
        } else {
          // Destroyed — big burst
          bl.alive = false;
          combo++;
          score += combo;
          comboTimer = 1.5;
          addFloatText(bl.x, bl.y - 20, combo > 1 ? `+${combo} COMBO!` : '+1', combo > 1 ? '#ffe066' : '#fff');
          addParticles(bl.x, bl.y, '#4fc3f7', 22, 'ice');
          addParticles(bl.x, bl.y, '#ffffff', 10, 'square');
          addParticles(bl.x, bl.y, '#b3e5fc', 8, 'ice');
          document.getElementById('score-display').textContent = score;
          const rx = 40 + Math.random() * (canvas.width - 80);
          const ry = 60 + Math.random() * (canvas.height * 0.4);
          setTimeout(() => { if(state==='play') blocks.push(makeBlock(rx, ry, 26 + Math.random()*14)); }, 2500);
        }
        break;
      }
    }
    if (hitBlock) continue;

    // NPC hit → GAME OVER
    for (const npc of npcs) {
      if (!npc.alive) continue;
      if (Math.hypot(b.x - npc.x, b.y - npc.y) < npc.r + 4) {
        addParticles(npc.x, npc.y, '#ef5350', 30, 'square');
        addParticles(npc.x, npc.y, '#fff', 10, 'square');
        npc.alive = false;
        triggerDeath();
        return;
      }
    }
  }

  // Combo decay
  comboTimer -= dt;
  if (comboTimer <= 0 && combo > 0) {
    combo = 0;
    document.getElementById('combo-display').style.opacity = '0';
  } else if (combo > 1) {
    const cd = document.getElementById('combo-display');
    cd.style.opacity = '1';
    cd.textContent = `🔥 x${combo} COMBO!`;
  }

  // NPCs — spawn from top, walk downward
  npcTimer -= dt;
  const maxNpcs = Math.min(3 + Math.floor(score / 8), 10);
  const spawnInterval = Math.max(0.6, 2.2 - score * 0.04);
  if (npcTimer <= 0 && npcs.filter(n=>n.alive).length < maxNpcs) {
    npcTimer = spawnInterval + Math.random() * 0.6;
    npcs.push(spawnNPC());
  }
  for (let i = npcs.length-1; i >= 0; i--) {
    const npc = npcs[i];
    if (!npc.alive) { npcs.splice(i,1); continue; }

    // Scared if bullet nearby
    let bulletNear = false;
    for (const b of bullets) {
      if (Math.hypot(b.x - npc.x, b.y - npc.y) < 80) { bulletNear = true; break; }
    }
    npc.scared = bulletNear;

    // Walk downward; speed scales with difficulty
    npc.y += npc.speed * diff * (npc.scared ? 1.8 : 1);
    if (npc.y > canvas.height + 50) npcs.splice(i, 1);
  }

  // Particles
  for (let i = particles.length-1; i >= 0; i--) {
    const p = particles[i];
    p.x += p.vx; p.y += p.vy;
    p.vy += 0.18; // gravity
    p.vx *= 0.95;
    p.life -= p.decay;
    if (p.life <= 0) particles.splice(i, 1);
  }

  // Float texts
  for (let i = floatTexts.length-1; i >= 0; i--) {
    const ft = floatTexts[i];
    ft.y += ft.vy; ft.life -= 0.022;
    if (ft.life <= 0) floatTexts.splice(i, 1);
  }
}

// ─── Render ───────────────────────────────────────────────────────────────────
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  drawBackground();

  // Blocks (behind player)
  blocks.forEach(b => { if (b.alive) drawBlock3D(b); });

  // Bullets
  bullets.forEach(b => {
    ctx.save();
    ctx.globalAlpha = Math.max(0.3, b.life);
    // Bullet trail
    ctx.strokeStyle = '#ffe066';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(b.x, b.y);
    ctx.lineTo(b.x - b.vx * 0.6, b.y - b.vy * 0.6);
    ctx.stroke();
    // Bullet head
    ctx.fillStyle = '#ff6f00';
    ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  });

  // NPCs
  npcs.forEach(npc => { if (npc.alive) drawNPC(npc); });

  // Player
  drawPlayer();

  // Particles
  particles.forEach(p => {
    ctx.save();
    ctx.globalAlpha = p.life * 0.9;
    ctx.fillStyle = p.color;
    if (p.type === 'ice') {
      // Hexagon-ish ice shard
      ctx.beginPath();
      const s = p.size;
      ctx.moveTo(p.x, p.y - s);
      ctx.lineTo(p.x + s*0.87, p.y - s*0.5);
      ctx.lineTo(p.x + s*0.87, p.y + s*0.5);
      ctx.lineTo(p.x, p.y + s);
      ctx.lineTo(p.x - s*0.87, p.y + s*0.5);
      ctx.lineTo(p.x - s*0.87, p.y - s*0.5);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(p.x, p.y, p.size, p.size);
    }
    ctx.restore();
  });

  // Float texts
  floatTexts.forEach(ft => {
    ctx.save();
    ctx.globalAlpha = ft.life;
    ctx.font = 'bold 20px "Fredoka One", sans-serif';
    ctx.fillStyle = ft.color;
    ctx.strokeStyle = '#0004'; ctx.lineWidth = 3;
    ctx.textAlign = 'center';
    ctx.strokeText(ft.text, ft.x, ft.y);
    ctx.fillText(ft.text, ft.x, ft.y);
    ctx.restore();
  });

  // Aim line (subtle)
  if (mouse.down) {
    ctx.save();
    ctx.globalAlpha = 0.18;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([6,6]);
    ctx.beginPath();
    ctx.moveTo(P.x + Math.cos(P.angle)*30, P.y + Math.sin(P.angle)*30);
    ctx.lineTo(P.x + Math.cos(P.angle)*90, P.y + Math.sin(P.angle)*90);
    ctx.stroke();
    ctx.restore();
  }
}

// ─── Game flow ────────────────────────────────────────────────────────────────
function initGame() {
  score = 0; combo = 0; comboTimer = 0;
  bullets = []; particles = []; floatTexts = []; npcs = [];
  npcTimer = 2;
  document.getElementById('score-display').textContent = '0';
  document.getElementById('combo-display').style.opacity = '0';
  P.init();
  spawnBlocks();
  // hide joystick during menu, show during play
  document.getElementById('joy-wrap').style.display = 'flex';
}

function triggerDeath() {
  state = 'dead';
  cancelAnimationFrame(raf);
  const ov = document.getElementById('overlay');
  document.getElementById('ov-title').textContent = score > 0 ? `Score: ${score}` : "Oops!";
  document.getElementById('ov-sub').textContent = score > 5 ? '🎯 Nice shooting!' : 'You shot someone!';
  document.getElementById('ov-btn').textContent = 'play again';
  ov.classList.remove('hidden');
}

let lastTime = 0;
function loop(ts) {
  const dt = Math.min((ts - lastTime) / 1000, 0.05);
  lastTime = ts;
  update(dt);
  render();
  raf = requestAnimationFrame(loop);
}

document.getElementById('ov-btn').addEventListener('click', () => {
  document.getElementById('overlay').classList.add('hidden');
  initGame();
  state = 'play';
  lastTime = performance.now();
  raf = requestAnimationFrame(loop);
});

// Initial render
render();
</script>
</body>
</html>
